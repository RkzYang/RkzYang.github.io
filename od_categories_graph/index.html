 function claim(){const a=A[S.claim],p=P[a.paper_id],typed=a.x.length&&a.y.length;
  count.textContent=short(p)+' · '+tier[a.coding_tier];legend.innerHTML='';
  plot.innerHTML=typed?'<div class="rc-flow" role="img" aria-label="Source relationship from '+esc(names(a.x)+' to '+names(a.y))+'"><dl class="rc-role"><dt>Focal concepts</dt><dd>'+esc(names(a.x))+'</dd></dl><span class="rc-arrow" aria-hidden="true">→</span><dl class="rc-role"><dt>Source relationship</dt><dd>'+esc(human(a.relation))+'</dd></dl><span class="rc-arrow" aria-hidden="true">→</span><dl class="rc-role"><dt>Consequences / outcomes</dt><dd>'+esc(names(a.y))+'</dd></dl></div>'+(a.moderator_concepts.length?'<div class="rc-condition"><div class="text-small text-muted">Moderator → qualifies this relationship</div>'+esc(names(a.moderator_concepts))+'</div>':''):fields([['Claim type','Prior-review summary'],['Concept mentions',names(a.concept_mentions)||null],['Effect roles','Not extracted; no directional effect drawn']]);
  selected.textContent=a.statement;detailLabel.textContent='Contribution, theoretical explanation and source evidence';detail.innerHTML=source(p)+fields([['Paper contribution',p.contribution]])+assertion(a);evidence.open=true;
 }
 function coverageTable(){return '<table class="table"><thead><tr><th>Located review set</th><th>Records covered</th><th>With source claims</th></tr></thead><tbody>'+Object.entries(D.review_coverage).map(([k,c])=>'<tr><td>'+esc(D.review_labels[k])+'</td><td class="tabular-nums">'+c.matched_unique_works+' / '+c.reviewed_records+'</td><td class="tabular-nums">'+c.with_claims+'</td></tr>').join('')+'</tbody></table>';}
 function coverage(){plot.innerHTML=coverageTable();legend.innerHTML='';count.textContent=D.papers.length+' distinct works after deduplication · '+D.metadata.utd24_work_count+' UTD24 works';selected.textContent='Complete coverage of the located review sets; sets overlap. Published-literature census coverage is unestablished.';
  let ids=S.coverage==='all'?D.papers.map(p=>p.id):S.coverage==='utd'?D.papers.filter(p=>p.utd24).map(p=>p.id):D.review_coverage[S.coverage].paper_ids;
  detailLabel.textContent='Reviewed works ('+ids.length+')';detail.innerHTML=fields([['Targeted source coding',D.metadata.paper_tiers.targeted_source_roles+' papers'],['Additional review and source coding',D.metadata.paper_tiers.review_source_roles+' papers'],['Prior-review partial roles',D.metadata.paper_tiers.prior_review_partial_roles+' papers; signs and tests remain unextracted'],['Prior-review summaries',D.metadata.paper_tiers.prior_review_summary+' papers'],['Identity only',D.metadata.paper_tiers.bibliographic_identity_only+' paper'],['Coverage unit','Review membership; distinct works deduplicated by DOI']])+'<ol>'+ids.map(id=>'<li><button class="btn btn-ghost" type="button" data-paper="'+id+'">'+esc(short(P[id])+' · '+P[id].title)+'</button></li>').join('')+'</ol>';detail.querySelectorAll('[data-paper]').forEach(b=>b.addEventListener('click',()=>{S.view='paper';S.paper=b.dataset.paper;render();save();}));
 }
 function connection(key){
  const [left,right]=key.split('|'),edge=D.projection.find(e=>e.source===left&&e.target===right);
  if(!edge)return;
  const w=Math.max(280,plot.clientWidth),h=255,l=C[left],r=C[right];
  count.textContent=edge.paper_ids.length+' source papers · '+edge.claim_ids.length+' source claims for this connection';
  legend.innerHTML='<span>Connection: concepts participate in the same source claim.</span>';
  let body='<line x1="'+w*.24+'" y1="70" x2="'+w*.76+'" y2="70" stroke-width="2" opacity=".55"/>';
  [[l,w*.24],[r,w*.76]].forEach(([c,x])=>{body+='<circle cx="'+x+'" cy="70" r="17" fill="'+color(c.family)+'" fill-opacity=".6"/>'+text(x,112,c.label,'middle',w<560?15:32)+'<circle data-select="c:'+c.id+'" class="cursor-interaction" cx="'+x+'" cy="70" r="25" fill="transparent" data-tooltip="'+esc(c.label)+'"/>';});
  plot.innerHTML=svg(w,h,body,'Source-supported co-participation connection between '+l.label+' and '+r.label+'. This is not a direct causal effect.');bind();
  selected.textContent=l.label+' ↔ '+r.label+' · source-claim co-participation';
  detailLabel.textContent='Papers and exact claims supporting this connection';
  detail.innerHTML=fields([['Connection meaning','Both concepts participate in the following source assertions. Role fields distinguish focal effects, moderators, mechanisms and summary mentions.'],['Inference limit','A projected link does not itself establish a causal effect or a tested interaction.']])+edge.claim_ids.map(id=>'<details class="rc-claims"><summary>'+esc(short(P[A[id].paper_id])+' · '+A[id].statement)+'</summary>'+source(P[A[id].paper_id])+assertion(A[id])+'</details>').join('');
  evidence.open=true;
 }

 function render(){view.value=S.view;options();({concept:network,paper,claim,coverage}[S.view])();}
 function restore(state){const s=state?.privateContent||state;if(!s)return;if(['concept','paper','claim','coverage'].includes(s.view))S.view=s.view;if(s.concept==='overview'||C[s.concept?.slice(2)]||families.includes(s.concept?.slice(2))||(s.concept?.startsWith("e:")&&D.projection.some(e=>"e:"+e.source+"|"+e.target===s.concept)))S.concept=s.concept;if(P[s.paper])S.paper=s.paper;if(A[s.claim])S.claim=s.claim;if(s.coverage==='all'||s.coverage==='utd'||D.review_coverage[s.coverage])S.coverage=s.coverage;}
 view.addEventListener('change',()=>{S.view=view.value;evidence.open=false;render();save();});picker.addEventListener('change',()=>choose(picker.value));
 root.querySelector('#rc-method').innerHTML=fields([['Source files','September9 categorization review; September11 OD review and source register; September28 accumulated paper audits; earlier targeted source coding.'],['Version','2.0 · '+D.papers.length+' distinct works; '+D.assertions.length+' claims'],['Independence','No manuscript framing, reviewer correspondence, proposed contributions or candidate gaps are imported.'],['Graph edge','Concept participation in a source assertion; no causal or tested-interaction interpretation follows from a projected line.'],['Moderators','Qualify a specified relationship. An empty field means unextracted or not applicable, never demonstrated absence.'],['Overview layout','All concepts grouped into six editorial families. Node position is for display; groups are not computational communities.'],['Source depth','Targeted text, original abstracts and prior-review summaries remain labeled individually. Complete full-paper coding is not claimed.'],['Structural holes','A missing coded connection is a question for closest-paper comparison; global novelty remains unverified.'],['Reusable base','Canonical source records are maintained separately from future manuscript overlays.']]);
 restore(window.openai?.widgetState);render();
 window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState){restore(e.detail.globals.widgetState);render();}});
 let width=plot.clientWidth;new ResizeObserver(()=>{const w=plot.clientWidth;if(Math.abs(w-width)>1){width=w;if(S.view==='concept')network();}}).observe(plot);
})();
</script>









<script>(() => {
 const root=document.getElementById('review-corpus-graph-20261004');
 const settings={subtree:true,childList:true,attributes:true,attributeFilter:['data-tooltip']};
 const annotate=()=>{
  observer.disconnect();
  for(const element of root.querySelectorAll('[data-tooltip]')){
   const label=element.dataset.tooltip;
   if(element.namespaceURI==='http://www.w3.org/2000/svg'){
    let title=element.querySelector('title');
    if(!title){title=document.createElementNS('http://www.w3.org/2000/svg','title');element.appendChild(title);}
    title.textContent=label;
   }else{element.setAttribute('title',label);}
  }
  observer.observe(root,settings);
 };
 const observer=new MutationObserver(annotate);
 annotate();
})();
</script>
