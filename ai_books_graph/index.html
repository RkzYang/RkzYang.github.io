        {name:'stage_mechanism_concepts',title:'Select concepts for mechanism synthesis',description:'Select two to eight valid concept IDs from this map and open the mechanism lab. Stages a draft only; does not generate, validate, or publish an insight.',inputSchema:{type:'object',properties:{concept_ids:{type:'array',items:{type:'string'},minItems:2,maxItems:8}},required:['concept_ids'],additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:true},execute(input){const ids=input?.concept_ids;if(!Array.isArray(ids)||Object.keys(input).some(k=>k!=='concept_ids')||ids.length<2||ids.length>8||ids.some(id=>!allNodes[id])||new Set(ids).size!==ids.length)throw new Error('Supply two to eight distinct, valid concept IDs.');lab.links=[];enterLab(ids);return {concept_ids:[...lab.concepts],view:state.view,status:'draft_staged'};}}
      ];
      for(const tool of definitions)try{Promise.resolve(document.modelContext.registerTool(tool,{signal:lifecycle.signal})).catch(()=>{});}catch{}
      window.addEventListener('pagehide',()=>lifecycle.abort(),{once:true});
    }

    function render(){
      if(!DATA.graphs[state.book])state.book='all';if(!DATA.graphs[state.book].nodes.some(n=>n.id===state.concept))state.concept='';
      $('map-view').value=state.view;$('map-book').value=state.book;
      $('map-book-field').hidden=state.view!=='network';$('map-concept-field').hidden=state.view!=='network';
      $('map-concept').innerHTML='<option value="">Overview</option>'+[...graph().nodes].sort((a,b)=>a.label.localeCompare(b.label)).map(n=>`<option value="${n.id}">${esc(n.label)}</option>`).join('');$('map-concept').value=state.concept;
      selectedEdge=null;if(state.view==='network')drawNetwork();else if(state.view==='dikw')drawPathways();else if(state.view==='mechanism')drawLab();else drawGaps();
    }
    $('map-view').addEventListener('change',e=>{state.view=e.target.value;render();remember();});
    $('map-book').addEventListener('change',e=>{state.book=e.target.value;state.concept='';render();remember();});
    $('map-concept').addEventListener('change',e=>{state.concept=e.target.value;selectedEdge=null;if(state.concept)nodeDetail(state.concept);else overview();drawEdges();remember();});
    $('map-methods').innerHTML=`<p class="text-small">Local, dictionary-guided analysis of all five supplied books. ${DATA.books.reduce((s,b)=>s+b.chunks,0).toLocaleString()} non-overlapping 180-word windows; page boundaries retained; tails shorter than 30 words omitted. Nodes and edges require at least three matched windows. Longest alias wins. Computational communities and normalized unweighted betweenness use the full supported network, while the picture shows each node’s three strongest links (union).</p><p class="text-small">InfraNodus-inspired presentation, using larger bridge nodes and colored communities. This implementation uses concept-window co-occurrence and greedy weighted modularity, rather than InfraNodus’s 4-gram lemma network and its own gap algorithm.</p><p class="text-small">D/I/K/W tags on vocabulary are editorial lenses. The separate evidence paths distinguish source observations, interpretations, book-grounded rules, and unvalidated decision syntheses. These papers do not establish a six-stage DIKIWI standard or automatic promotion to wisdom.</p>${DATA.interpretation.methods.map(m=>`<div class="map-method"><span>${esc(m.title)} · PDF pp. ${m.pages}</span><p class="text-small">${esc(m.use)}</p></div>`).join('')}<p class="text-small">Vocabulary is seeded and incomplete. “Learning” combines human and model learning; “product” spans several meanings. Page headers, captions, and footnotes may remain. No semantic entailment, negation detection, exhaustive claim extraction, or business-effect validation is claimed. Source PDF hashes, aliases, body ranges, and all window matches are preserved in the research package.</p>`;
    window.addEventListener('openai:set_globals',e=>{const s=e.detail?.globals?.widgetState?.privateContent;if(s&&DATA.graphs[s.book]){state={...state,...s};render();}});
    let timer;new ResizeObserver(()=>{clearTimeout(timer);timer=setTimeout(()=>{if(state.view==='network')drawNetwork();},100);}).observe($('map-main'));
    render();
  })();
  </script>
</div>
